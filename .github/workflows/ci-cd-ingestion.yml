name: "CI/CD — FIN Ingestion & Scrapers REA"

on:
  push:
    branches: ["main"]
    paths:
      - "fin_ingestion/**"
      - "dbt/**"
      - ".github/workflows/ci-cd-ingestion.yml"
  pull_request:
    branches: ["main"]

jobs:
  test-collectors:
    name: "Test 12 REA Collectors & Parsers"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --all-extras
          fi

      - name: Test Ingestion Pipelines
        run: |
          uv run pytest tests/ -v
