name: "CI/CD — FIN-DB Migration & Verification"

on:
  push:
    branches: ["main"]
    paths:
      - "sql/**"
      - "scripts/**"
      - ".github/workflows/ci-cd-db.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "sql/**"
      - "scripts/**"

jobs:
  verify-sql:
    name: "Validate SQL Syntax & Healthcheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dry-run Migrations
        run: |
          echo "Checking SQL migration scripts idempotency and IF NOT EXISTS / ADD COLUMN IF NOT EXISTS compliance..."
          # uv run --with "psycopg[binary]" python3 scripts/migrate.py --dry-run
