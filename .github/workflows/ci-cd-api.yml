name: "CI/CD — FIN API & ARQ Worker"

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/ci-cd-api.yml"
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: "Lint, Typecheck & Pytest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}

      - name: Install dependencies
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --all-extras
          fi

      - name: Run Ruff Linter
        run: |
          if [ -d app ]; then
            uv run ruff check app/
          fi

      - name: Run Pytest Tests
        run: |
          if [ -d tests ]; then
            uv run pytest tests/ -v
          fi

  build-and-deploy:
    name: "Docker Build, Push ECR & Deploy ECS"
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          echo "Building multi-stage production Docker image for fin-api..."
          # docker build -t fin-api:${{ github.sha }} .

      - name: Rolling Deploy to ECS Fargate
        run: |
          echo "Deploying new revision to ECS Service fin-api-service..."
