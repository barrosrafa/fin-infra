name: Terraform AWS reference validation

on:
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.7.5'
      - run: terraform fmt -check -recursive terraform/
      - name: Validate reference configurations without cloud credentials
        run: |
          for environment in staging production; do
            terraform -chdir=terraform/environments/$environment init -backend=false
            terraform -chdir=terraform/environments/$environment validate
          done
