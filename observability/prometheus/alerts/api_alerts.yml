groups:
  - name: api_alerts
    rules:
      - alert: ApiHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="fin-api"}[5m]))) > 0.05
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Latência p95 da API superior a 50ms"
          description: "O tempo de resposta p95 da FIN-API excedeu 50ms nos últimos 5 minutos (Meta: p95 < 20ms com Redis cache)."

      - alert: ApiErrorRateHigh
        expr: (sum(rate(http_requests_total{service="fin-api", status=~"5.."}[5m])) / sum(rate(http_requests_total{service="fin-api"}[5m]))) > 0.01
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Taxa de erro HTTP 5xx superior a 1% na API"
          description: "Mais de 1% das requisições de clientes estão falhando com status 5xx nos últimos 2 minutos."

      - alert: ApiServiceDown
        expr: up{service="fin-api"} == 0
        for: 1m
        labels:
          severity: disaster
          team: backend
        annotations:
          summary: "FIN-API está FORA DO AR"
          description: "Nenhuma instância da FIN-API está respondendo aos scrapes de saúde do Prometheus."
