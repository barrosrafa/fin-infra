# ========================================================
# SQUID FORWARD PROXY — Scraper Egress Gateway for FIN
# ========================================================

http_port 3128

# ACLs de Rede Interna
acl localnet src 10.0.0.0/8     # VPC AWS / Subnets privadas
acl localnet src 172.16.0.0/12  # Docker default bridge
acl localnet src 192.168.0.0/16
acl localhost src 127.0.0.1/32

# ACLs de Métodos e Portas Seguras
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl CONNECT method CONNECT

# Bloqueio de portas inseguras
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Libera acesso para a rede interna
http_access allow localhost
http_access allow localnet
http_access deny all

# ========================================================
# ANONYMIZATION & ANTI-BOT FINGERPRINTING
# ========================================================
# Remove headers que revelam o IP de origem dos servidores de scraping
forwarded_for delete
via off

# Headers HTTP customizados para emulação consistente de navegadores modernos
request_header_access From deny
request_header_access Server deny
request_header_access User-Agent allow
request_header_access Accept allow
request_header_access Accept-Encoding allow
request_header_access Accept-Language allow
request_header_access Connection allow
request_header_access All allow

# Otimizacao de conexoes de saida
server_persistent_connections on
client_persistent_connections on
connect_timeout 15 seconds
read_timeout 30 seconds
request_timeout 30 seconds

# Logging estruturado para auditoria de requisicoes de coleta
logformat json_squid {"timestamp":"%{%Y-%m-%dT%H:%M:%S%z}tg","client_ip":"%>a","response_time":%tr,"http_status":%>Hs,"http_method":"%rm","url":"%ru","bytes_sent":%<st,"mime_type":"%mt"}
access_log daemon:/var/log/squid/access.log json_squid
