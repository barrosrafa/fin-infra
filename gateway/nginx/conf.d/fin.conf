upstream fin_api_backend {
    server fin-api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redireciona HTTP para HTTPS em producao
    location / {
        return 301 https://$host$request_uri;
    }

    # Endpoint de Health Check local do Load Balancer
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fin.crt;
    ssl_certificate_key /etc/nginx/certs/fin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Never cache authenticated API responses or mutations at the gateway.
    proxy_cache off;

    # Security Headers
    add_header Cache-Control "private, no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Webhooks de Cobranca (Asaas / Stripe)
    location ~* ^/(v1/)?billing/webhooks/ {
        limit_req zone=webhook_limit burst=50 nodelay;

        proxy_pass http://fin_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserva o body original para assinatura HMAC
        proxy_pass_request_body on;
        proxy_buffers 8 32k;
        proxy_buffer_size 64k;
        proxy_read_timeout 30s;
    }

    # API Geral
    location / {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass http://fin_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
        proxy_read_timeout 20s;
    }
}
