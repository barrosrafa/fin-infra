services:
  # ========================================================
  # 1. INGRESS API GATEWAY (Traefik)
  # ========================================================
  traefik:
    image: traefik:v3.0
    container_name: fin-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard do Traefik & Metricas
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/traefik/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
    networks:
      - fin-network

  # ========================================================
  # 2. CACHE & TASK BROKER (Redis 7)
  # ========================================================
  redis:
    image: redis:7.2-alpine
    container_name: fin-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-finsecretredis}" --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fin-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-finsecretredis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========================================================
  # 3. SCRAPER EGRESS GATEWAY (Forward Proxy Cluster)
  # ========================================================
  squid:
    image: ubuntu/squid:5.2-22.04_beta
    container_name: fin-squid-proxy
    restart: unless-stopped
    ports:
      - "3128:3128"
    volumes:
      - ./gateway/egress_proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - fin-network

  proxy-rotator:
    build:
      context: ./gateway/egress_proxy
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        RUN pip install --no-cache-dir httpx prometheus-client
        COPY proxy_rotator.py /app/
        CMD ["python", "proxy_rotator.py"]
    container_name: fin-proxy-rotator
    restart: unless-stopped
    environment:
      - METRICS_PORT=9091
      - RESIDENTIAL_PROXY_URL=${RESIDENTIAL_PROXY_URL:-}
      - DATACENTER_PROXY_URL=${DATACENTER_PROXY_URL:-}
    ports:
      - "9091:9091" # Metricas do Scraper Gateway
    networks:
      - fin-network

  # ========================================================
  # 4. BACKGROUND WORKER & INGESTION CLUSTER
  # ========================================================
  fin-worker:
    build:
      context: ../fin-api
      dockerfile: Dockerfile
    container_name: fin-worker
    restart: unless-stopped
    command: python -m app.worker.tasks
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-finsecretredis}@redis:6379/0
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/fin_db}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fin-network

  # Agendador autônomo baseado em políticas e calendários de mercado
  fin-ingestion-scheduler:
    build:
      context: ../fin-ingestion
      dockerfile: Dockerfile
    container_name: fin-ingestion-scheduler
    restart: unless-stopped
    command: ["python", "-m", "fin_ingestion.cli", "scheduler-start", "--interval", "60"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_ASYNC=${DATABASE_URL_ASYNC}
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://:${REDIS_PASSWORD:-finsecretredis}@redis:6379/0
      - DISTRIBUTED_SOURCE_CONTROLS=true
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fin-network

  # Worker autônomo da fila persistente no PostgreSQL (FOR UPDATE SKIP LOCKED)
  fin-ingestion-worker:
    build:
      context: ../fin-ingestion
      dockerfile: Dockerfile
    container_name: fin-ingestion-worker
    restart: unless-stopped
    command: ["python", "-m", "fin_ingestion.workers.runner"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_ASYNC=${DATABASE_URL_ASYNC}
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://:${REDIS_PASSWORD:-finsecretredis}@redis:6379/0
      - DISTRIBUTED_SOURCE_CONTROLS=true
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fin-network

networks:
  fin-network:
    name: fin-network
    driver: bridge

volumes:
  redis_data:
